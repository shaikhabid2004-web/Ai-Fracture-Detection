services:
  - type: web
    name: bonesense-fracture-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --chdir . src.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
